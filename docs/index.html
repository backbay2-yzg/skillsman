  <style>
    :root {
      color-scheme: light;
      --accent: #0078d4;
      --accent-hover: #106ebe;
      --accent-soft: rgba(0, 120, 212, 0.13);
      --accent-border: rgba(0, 120, 212, 0.34);

      --mica-bg: radial-gradient(circle at 12% 10%, rgba(0, 120, 212, 0.12), transparent 44%),
                 radial-gradient(circle at 88% 12%, rgba(3, 131, 135, 0.09), transparent 40%),
                 #f3f3f3;
      --mica-shell: rgba(243, 243, 243, 0.84);
      --mica-canvas: rgba(255, 255, 255, 0.72);
      --card-bg: rgba(255, 255, 255, 0.84);
      --card-hover: rgba(255, 255, 255, 0.96);
      --card-subtle: rgba(0, 0, 0, 0.035);
      --card-border: rgba(0, 0, 0, 0.085);
      --divider: rgba(0, 0, 0, 0.075);
      --input-bg: rgba(255, 255, 255, 0.84);
      --input-border: rgba(0, 0, 0, 0.15);
      --drawer-bg: rgba(249, 249, 249, 0.96);

      --text-primary: #1a1a1a;
      --text-secondary: #5c5c5c;
      --text-muted: #8a8a8a;

      --success: #0f7b0f;
      --success-soft: rgba(15, 123, 15, 0.12);
      --warning: #9d5d00;
      --warning-soft: rgba(157, 93, 0, 0.12);
      --danger: #c42b1c;
      --danger-soft: rgba(196, 43, 28, 0.12);
    }

    html.dark {
      color-scheme: dark;
      --accent: #60cdff;
      --accent-hover: #4cc2ff;
      --accent-soft: rgba(96, 205, 255, 0.16);
      --accent-border: rgba(96, 205, 255, 0.36);

      --mica-bg: radial-gradient(circle at 12% 10%, rgba(96, 205, 255, 0.12), transparent 44%),
                 radial-gradient(circle at 88% 12%, rgba(135, 100, 184, 0.11), transparent 40%),
                 #1b1b1b;
      --mica-shell: rgba(28, 28, 28, 0.82);
      --mica-canvas: rgba(38, 38, 38, 0.72);
      --card-bg: rgba(48, 48, 48, 0.76);
      --card-hover: rgba(58, 58, 58, 0.88);
      --card-subtle: rgba(255, 255, 255, 0.045);
      --card-border: rgba(255, 255, 255, 0.085);
      --divider: rgba(255, 255, 255, 0.08);
      --input-bg: rgba(36, 36, 36, 0.82);
      --input-border: rgba(255, 255, 255, 0.14);
      --drawer-bg: rgba(34, 34, 34, 0.96);

      --text-primary: #ffffff;
      --text-secondary: #cccccc;
      --text-muted: #929292;

      --success: #6ccb5f;
      --success-soft: rgba(108, 203, 95, 0.15);
      --warning: #fce100;
      --warning-soft: rgba(252, 225, 0, 0.14);
      --danger: #ff99a4;
      --danger-soft: rgba(255, 153, 164, 0.15);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--mica-bg);
      background-attachment: fixed;
      color: var(--text-primary);
      font-family: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", system-ui, -apple-system, sans-serif;
      font-size: 13.5px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--mica-shell);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--divider);
    }

    .topbar-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand img {
      width: 24px;
      height: 24px;
      border-radius: 5px;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .shell-grid {
      max-width: 1280px;
      margin: 18px auto 40px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .toc-rail {
      position: sticky;
      top: 72px;
      background: var(--mica-canvas);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 10px;
      max-height: calc(100vh - 96px);
      overflow-y: auto;
    }

    .toc-group-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 6px 10px 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .toc-link {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 7px 10px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12.5px;
      text-align: left;
      cursor: pointer;
      transition: background-color 120ms ease, color 120ms ease;
    }

    .toc-link:hover {
      background: var(--card-subtle);
      color: var(--text-primary);
      text-decoration: none;
    }

    .toc-link.active {
      background: var(--card-bg);
      color: var(--text-primary);
      font-weight: 600;
    }

    .toc-link.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 6px;
      bottom: 6px;
      width: 3px;
      border-radius: 999px;
      background: var(--accent);
    }

    .canvas-main {
      background: var(--mica-canvas);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 24px;
      min-width: 0;
    }

    .fluent-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      transition: background-color 140ms ease, border-color 140ms ease;
    }

    .fluent-card-interactive:hover {
      background: var(--card-hover);
    }

    .fluent-input {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-bottom: 2px solid var(--input-border);
      color: var(--text-primary);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
      font-family: inherit;
    }

    .fluent-input:focus {
      border-bottom-color: var(--accent);
    }

    .fluent-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-primary);
      font-family: inherit;
      transition: background-color 120ms ease, border-color 120ms ease;
    }

    .fluent-btn:hover {
      background: var(--card-hover);
    }

    .fluent-btn-primary {
      background: var(--accent);
      color: #ffffff;
      border-color: transparent;
    }

    html.dark .fluent-btn-primary {
      color: #0b1926;
      font-weight: 600;
    }

    .fluent-btn-primary:hover {
      background: var(--accent-hover);
    }

    .segmented {
      display: inline-flex;
      align-items: center;
      padding: 2px;
      border-radius: 7px;
      border: 1px solid var(--card-border);
      background: var(--card-subtle);
      gap: 2px;
    }

    .segmented button {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      padding: 5px 11px;
      border-radius: 5px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background-color 120ms ease, color 120ms ease;
    }

    .segmented button.active {
      background: var(--card-hover);
      color: var(--text-primary);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .badge-neutral {
      background: var(--card-subtle);
      color: var(--text-secondary);
      border-color: var(--card-border);
    }
    .badge-accent {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent-border);
    }
    .badge-success {
      background: var(--success-soft);
      color: var(--success);
    }
    .badge-warning {
      background: var(--warning-soft);
      color: var(--warning);
    }
    .badge-danger {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .hero-box {
      padding: 20px;
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hero-box h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .hero-box p {
      margin: 0;
      color: var(--text-secondary);
      font-size: 13.5px;
    }

    .section-block {
      margin-top: 26px;
      scroll-margin-top: 76px;
    }

    .section-head {
      margin-bottom: 12px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .section-head p {
      margin: 4px 0 0;
      font-size: 12.5px;
      color: var(--text-secondary);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .scope-flow {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .scope-node {
      padding: 12px;
      text-align: left;
      cursor: pointer;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-primary);
      font-family: inherit;
      transition: border-color 140ms ease, background-color 140ms ease, transform 140ms ease;
    }

    .scope-node:hover {
      background: var(--card-hover);
    }

    .scope-node.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .progress-bar-track {
      height: 8px;
      border-radius: 999px;
      background: var(--card-subtle);
      border: 1px solid var(--card-border);
      overflow: hidden;
      flex: 1;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 220ms ease;
    }

    .case-card {
      padding: 18px;
      margin-bottom: 14px;
      scroll-margin-top: 78px;
    }

    .case-card.flash-highlight {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .step-item {
      display: flex;
      gap: 12px;
      padding: 12px;
      border-radius: 8px;
      background: var(--card-subtle);
      border: 1px solid var(--card-border);
    }

    .step-num {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: var(--accent);
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    html.dark .step-num {
      color: #0b1926;
    }

    .tip-callout {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      background: var(--accent-soft);
      border-left: 3px solid var(--accent);
      font-size: 12px;
      color: var(--text-primary);
    }

    .verify-box {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 7px;
      background: var(--success-soft);
      border: 1px solid transparent;
      font-size: 12.5px;
      color: var(--text-primary);
    }

    details.expander {
      margin-top: 12px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: var(--card-subtle);
      overflow: hidden;
    }

    details.expander summary {
      padding: 10px 12px;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-primary);
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    details.expander summary::-webkit-details-marker {
      display: none;
    }

    details.expander summary::after {
      content: "▾";
      font-size: 12px;
      color: var(--text-secondary);
      transition: transform 140ms ease;
    }

    details.expander[open] summary::after {
      transform: rotate(180deg);
    }

    details.expander .expander-body {
      padding: 0 12px 12px;
      border-top: 1px solid var(--divider);
      font-size: 12.5px;
      color: var(--text-secondary);
    }

    pre.code-block {
      margin: 8px 0 0;
      padding: 12px;
      border-radius: 7px;
      background: var(--card-subtle);
      border: 1px solid var(--card-border);
      font-family: "Cascadia Code", "Consolas", monospace;
      font-size: 12px;
      line-height: 1.5;
      overflow-x: auto;
      color: var(--text-primary);
      white-space: pre;
    }

    code.inline {
      font-family: "Cascadia Code", "Consolas", monospace;
      font-size: 12px;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--card-subtle);
      border: 1px solid var(--card-border);
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      background: var(--card-bg);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }

    th, td {
      text-align: left;
      padding: 9px 12px;
      border-bottom: 1px solid var(--divider);
      vertical-align: top;
    }

    th {
      font-weight: 600;
      background: var(--card-subtle);
      color: var(--text-primary);
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 60;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: var(--drawer-bg);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.2);
      font-size: 12.5px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 150ms ease, transform 150ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 960px) {
      .shell-grid {
        grid-template-columns: 1fr;
      }
      .toc-rail {
        position: static;
        max-height: none;
      }
      .grid-2, .grid-3, .scope-flow {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      .topbar, .toc-rail, .no-print {
        display: none !important;
      }
      .shell-grid {
        display: block;
        margin: 0;
        padding: 0;
      }
      .canvas-main {
        border: none;
        background: #ffffff;
      }
    }
  </style>

蔽」恢复继承。"},{"id":"conflict","label":"冲突","tone":"danger","meaning":"目标路径上已经存在非 SkillsMan 管理的旧目录，或 Copy 副本被外部改过。SkillsMan 主动停手保护文件。","clickAction":"前往「总览」的「状态与冲突处理」选择「收编入库」或「备份后覆盖」。"},{"id":"inactive","label":"未分配","tone":"neutral","meaning":"该 Agent 目录里当前不会出现这个 Skill。","clickAction":"在用户级或项目级点击一次单元格即可设为「直配」开启。"}],"routeSwitchLabelA":"路线 A：6 步循序渐进通关课","routeSwitchLabelB":"路线 B：按你的场景 1 分钟速通","routeADesc":"适合从零完整掌握 SkillsMan：每完成一个案例勾选右侧复选框，系统会自动记住你的进度。","routeBDesc":"如果你时间紧张，先对号入座选一条与你当前目标最接近的路线，直接跟着清单跳转实操。","cases":[{"id":"case-1","badge":"案例 1 · 新手必做","title":"从在线市场 / Git 仓库安装第一个 Skill 并全局生效","duration":"约 2 分钟","scenario":"你刚打开 SkillsMan，中央库还是空的，想先装一个现成的优质 Skill 体验一下。","goal":"从在线市场或官方 Git 仓库把 Skill 下载到中央库，并一键分发给你电脑上的全部 AI 编程工具。","steps":[{"title":"先确认本机哪些 AI 工具已开启","detail":"打开「Agent 配置」页面，查看上方带有绿色「本机已检测」标签的 Agent（如 Claude Code、Cursor、Antigravity 等）。确保右侧开关处于开启状态；如果你刚新装了某个 AI 工具，点右上角「重新扫描本机 Agent」。","uiPath":"左侧导航 → Agent 配置","targetTab":"agents","targetLabel":"去 Agent 配置查看"},{"title":"从在线市场或 Git 仓库下载 Skill 到中央库","detail":"切换到「仓库与市场」页面：方法一是在「在线市场 (skills.sh)」标签页搜索关键词（如 react、testing、commit），找到喜欢的条目点击「下载入库」；方法二是在「Git 仓库源」标签页对内置的 Anthropic Official Skills 点击「拉取并扫描」，勾选需要的 Skill 点「安装选中」。","uiPath":"左侧导航 → 仓库与市场","targetTab":"repos","targetLabel":"打开仓库与市场","tip":"国内网络如果拉取 GitHub 较慢，可先在「设置」填入 HTTP/SOCKS5 代理或 GitHub 加速镜像前缀。"},{"title":"在分配矩阵打开「全局级」开关","detail":"进入「分配矩阵」页面（默认就在「全局级」视图），找到刚才入库的 Skill 那一行，点击最左侧的「全局」开关使其高亮开启。最后点击右上角蓝色的「立即同步全部」（或开启全局时系统会自动触发一次同步）。","uiPath":"左侧导航 → 分配矩阵 → 全局列开关","targetTab":"matrix","targetLabel":"去分配矩阵开启"}],"verify":"矩阵中所有已启用 Agent 列都会变为「全局 / 继承」状态；打开任意一个已启用 Agent 的目录（如 ~/.claude/skills/），能看到对应的 Skill 文件夹已出现，且顶部或抽屉显示 synced。","advancedNote":{"title":"进阶原理解析：为什么在市场点完下载，AI 还是看不到？","bullets":["SkillsMan 采用「入库」与「分配」分离的设计：下载只是把文件存进中央库（store/），不会贸然塞满所有工具目录。","只有在「分配矩阵」或「项目管理」里勾选分配后，部署器（Deployer）才会在对应目录建立 Windows Junction 联接或复制文件。"]},"relatedRoles":["role-solo"]},{"id":"case-2","badge":"案例 2 · 迁移与创作","title":"一键收编本机散落的旧 Skills，或 1 分钟新建自己的 Skill","duration":"约 3 分钟","scenario":"你以前自己在 Cursor、Claude 或 Antigravity 里建过几个 SKILL.md，或者刚写好一段提示词想做成可复用的 Skill。","goal":"把各处散落的旧技能收编进中央库统一接管，并学会用可视化抽屉创建与编辑 Skill。","steps":[{"title":"扫描并收编本机已有散落 Skills","detail":"进入「Skills 库」，点击右上角「扫描收编本机 Skills」。系统会自动扫描所有已配置 Agent 用户目录中尚未纳管的 Skill 文件夹，在弹窗中勾选它们并点击「收编选中项」。","uiPath":"左侧导航 → Skills 库 → 扫描收编本机 Skills","targetTab":"library","targetLabel":"去 Skills 库扫描","tip":"放心勾选！收编会自动把原目录复制进中央库，同时保留该原 Agent 的用户级绑定并替换成安全联接，不会让原有工具失灵。"},{"title":"导入本地文件夹或 ZIP 压缩包（可选）","detail":"如果朋友发给你一个包含 SKILL.md 的文件夹或 .zip 压缩包，直接点「Skills 库」右上角的「导入文件夹」或「导入 ZIP」即可一键入库。","uiPath":"Skills 库 → 导入文件夹 / 导入 ZIP"},{"title":"新建并编辑你的第一个自定义 Skill","detail":"点击「新建 Skill」（或直接在本页面顶部沙盒一键创建练习示例），填好名称、描述、标签和正文，提交后会自动打开右侧详情抽屉。你可以切换「预览 / 编辑 / 生效链路」三个页签，改完点「保存并同步」或点图标直接用 VS Code 打开编辑。","uiPath":"Skills 库 → 新建 Skill → 右侧抽屉"}],"verify":"在「Skills 库」卡片列表能看到新收编或新建的卡片；如果刚才编辑了正文，所有已挂载此 Skill 的 Junction 目录会实时反映最新内容，Copy 模式目标也会自动更新。","advancedNote":{"title":"进阶原理解析：收编时如果原目录与库里已有同名 Skill 怎么办？","bullets":["扫描弹窗会用黄色「Slug exists」徽章提示重名；收编时会自动生成不冲突的唯一 slug（如 my-skill-2），不会覆盖中央库里已有的正本。","详情抽屉的「保存并同步」不仅保存 SKILL.md，还会重新计算目录内容 SHA-256 哈希并自动同步所有 Copy 模式副本。"]},"relatedRoles":["role-solo","role-migrate"]},{"id":"case-3","badge":"案例 3 · 项目隔离","title":"为不同代码项目独立配 Skills，还不弄脏 Git 记录","duration":"约 3 分钟","scenario":"你同时维护前端项目 A 和后端项目 B，不想把后端规范塞进前端项目，也不想在 git status 里看到一堆未跟踪的技能目录。","goal":"在「项目管理」中导入本地仓库，配好专属技能与 .gitignore 自动托管块，或按需切换 Copy 模式共享给团队。","steps":[{"title":"添加本地项目目录或批量扫描工作区","detail":"打开「项目管理」页面：单个项目点右上角「添加项目」选中代码根目录；如果一个文件夹下放了十几个项目，点「批量扫描工作区」选父目录，SkillsMan 会自动识别带 .git 或项目标识的子文件夹供勾选导入。","uiPath":"左侧导航 → 项目管理 → 添加项目 / 批量扫描工作区","targetTab":"projects","targetLabel":"去项目管理添加"},{"title":"勾选该项目使用的 Agents、工作流与直配 Skills","detail":"在右侧详情面板依次勾选「项目启用的 Agents」（比如只勾 Cursor 和 Claude Code），再按需点亮「绑定工作流」或「项目直配 Skills」。注意：这里只影响当前项目，不会影响你其他项目。","uiPath":"项目管理 → 右侧详情面板"},{"title":"按个人隔离或团队共享选择部署模式与 .gitignore","detail":"如果是个人开发不想把本地目录提交到团队 Git，保持默认「跟随 Agent 默认 / Junction」并打开「自动维护 .gitignore 托管区块」；如果是要把项目技能随仓库提交给同事或 CI 使用，把「部署模式覆写」设为「真实文件复制 (Copy)」并关闭自动写 .gitignore。最后点「同步此项目」。","uiPath":"项目管理 → 部署选项 → 同步此项目","tip":"右键点击「项目直配 Skills」里的任意技能标签，可以直接弹出该 Skill 的预览与编辑抽屉！"}],"verify":"打开该项目根目录下的 .claude/skills/ 或 .cursor/skills/，已分配的 Skill 已经出现；若开启了自动托管，项目 .gitignore 末尾会自动写入 `# \u003e\u003e\u003e SkillsMan Managed \u003e\u003e\u003e` 区块并列出托管路径。","advancedNote":{"title":"进阶原理解析：全局技能会不会自动塞进项目目录？","bullets":["不会！全局级只部署到每个 Agent 的「用户级目录」，项目级目录完全由项目自己的「绑定工作流」「项目直配 Skills」与「单 Agent 例外覆写」决定，边界非常干净。","部署模式存在三级优先级：项目内「单 Agent 例外覆写」 \u003e 「项目部署模式覆写」 \u003e 「Agent 默认模式」。"]},"relatedRoles":["role-team"]},{"id":"case-4","badge":"案例 4 · 效率倍增","title":"把多个 Skills 编排成工作流套件，在托盘 1 秒切换","duration":"约 3 分钟","scenario":"做一个完整功能常要经历“规划 → 编码 → 测试 → 审查”四步，每次手动逐个勾选十几个 Skill 太麻烦。","goal":"创建或使用多阶段工作流套件，绑定到全局或项目，并利用指引生成与 Windows 托盘菜单快速切换工作模式。","steps":[{"title":"进入工作流页面并编排阶段","detail":"点击左侧「工作流」，可以看到系统自带的「全栈标准开发流」（含规划设计、编码实现、测试验证、审查交付四个阶段），也可以点「新建工作流」。在每个阶段点「+ 添加 Skill 到此阶段」，并用上下箭头调整阶段顺序。","uiPath":"左侧导航 → 工作流","targetTab":"workflows","targetLabel":"打开工作流套件"},{"title":"按需开启“导出工作流编排指引 SKILL.md”","detail":"打开「导出工作流编排指引 SKILL.md」开关并点击「保存工作流」。开启后，SkillsMan 在部署这个工作流时会自动额外生成一个名为 `workflow-\u003cslug\u003e` 的总控 Skill，告诉 AI 应该按哪几个阶段顺序依次调用这些技能。","uiPath":"工作流 → 导出工作流编排指引 SKILL.md → 保存工作流"},{"title":"在页面、总览或系统托盘一键开关整套工作流","detail":"在工作流页面底部的「快速绑定分配」可一键绑定到「全局级生效」「单 Agent 用户级」或「项目级」；绑定到全局的套件，后续无需打开主窗口，直接右键 Windows 右下角系统托盘的 SkillsMan 图标 →「快速切换全局工作流」，勾选即可秒级切换！","uiPath":"工作流快速绑定 / 总览快速开关 / 系统托盘菜单"}],"verify":"打开「总览」的「全局工作流快速开关」或右键托盘菜单，工作流勾选状态与实际部署目录实时保持同步；若开启了导出的编排指引，Agent 目录里还会多出一个 `workflow-\u003cslug\u003e` 目录。","advancedNote":{"title":"进阶原理解析：如果工作流指引不希望某个 Agent 收到怎么办？","bullets":["工作流指引生成需要双方同时允许：工作流本身的「导出工作流编排指引」开启，且目标 Agent（「Agent 配置」→ 允许工作流指引文件）或目标项目（「项目管理」→ 允许导出工作流指引文件）也开启。","关闭其中任意一方的开关，就只会部署阶段里的真实 Skills，不会生成总控指引文件。"]},"relatedRoles":["role-solo","role-team"]},{"id":"case-5","badge":"案例 5 · 精细掌控","title":"用「分配矩阵」单独屏蔽某个 Agent，并用「生效链路」排错","duration":"约 2 分钟","scenario":"你开启了一个全局 Skill，但唯独不想让 OpenAI Codex 或某个项目里的 Copilot 看到它；或者忘了某条 Skill 到底部署去了哪里。","goal":"熟练使用全局/用户/项目三视角矩阵进行「屏蔽 (Mute)」与「直配」，并用 Skill 抽屉的「生效链路 (Trace)」一眼定位所有磁盘路径。","steps":[{"title":"在分配矩阵切换作用域并单独屏蔽例外","detail":"打开「分配矩阵」，在顶部切换「全局级 / 用户级 / 项目级」。对于已通过全局继承过来的 Skill，直接点击某个 Agent 格子里蓝色的「全局」徽章，它会立刻变成橙色的「屏蔽」——只对这一个 Agent 关闭，其他 Agent 依然正常生效。","uiPath":"左侧导航 → 分配矩阵 → 点击绿色/蓝色单元格","targetTab":"matrix","targetLabel":"去分配矩阵体验"},{"title":"在用户级或项目级给单个 Agent“开小灶”","detail":"切换到「用户级」或「项目级」视图，在原本「未分配」的灰格子里点击一下，即可为该 Agent 单独「直配」一个技能；在矩阵左列点击任何 Skill 名称，可随时拉出右侧详情抽屉。","uiPath":"分配矩阵 → 切换用户级/项目级 → 点击单元格或行标题"},{"title":"用「生效链路 (Trace)」一眼查清来龙去脉","detail":"在任意 Skill 的右侧详情抽屉切换到「生效链路」页签，这里会按作用域列出该 Skill 当前在每个 Agent、每个项目下的真实磁盘路径（targetPath）、生效来源（global / workflow / direct / agent-override）、部署模式和同步状态。","uiPath":"点击任意 Skill → 右侧抽屉 → 生效链路","tip":"用快捷键 Ctrl+K 打开命令面板，输入 Skill 名称回车即可秒开它的详情抽屉！"}],"verify":"在「Agent 配置」展开对应 Agent 卡片，底部的「已屏蔽的全局项」也会列出刚才被静音的条目（点小叉号也可随时解除）；「生效链路」里不再部署到被屏蔽的磁盘路径。","advancedNote":{"title":"进阶原理解析：全局静音与直配叠加时谁赢？","bullets":["在用户级规则中：Agent 自己的「直配 (UserSkillIDs)」优先级高于「全局屏蔽 (GlobalMutedSkillIDs)」。也就是说即使它在全局被静音，只要你在用户级给它点了直配，它仍会生效。","在项目级规则中：项目内「单 Agent 例外追加 (ExtraSkillIDs)」优先级高于「项目排除」和「单 Agent 屏蔽」。"]},"relatedRoles":["role-team","role-migrate"]},{"id":"case-6","badge":"案例 6 · 稳健运维","title":"冲突安全修复、国内代理镜像配置与 U 盘绿色便携模式","duration":"约 3 分钟","scenario":"同步时遇到目标目录已有老文件冲突，或者拉取 GitHub 仓库超时，亦或想把整套 Skills 带去另一台 Windows 电脑。","goal":"学会无损处理冲突与副本漂移、配好网络代理/镜像，并掌握绿色便携模式的开启方式。","steps":[{"title":"无损处理「状态与冲突处理」警告","detail":"当「总览」导航图标出现红色角标时，表示目标路径存在 SkillsMan 未纳管的文件（conflict）或 Copy 副本被外部改动（drift）。SkillsMan 绝不会静默覆盖你的文件，而是停下来给你 3 个安全选项：「收编入库」（保留那份目录为新 Skill）、「备份后覆盖」（先挪到 backups/ 备份再同步）或对漂移副本点「强制覆盖同步」。","uiPath":"左侧导航 → 总览 → 状态与冲突处理","targetTab":"dashboard","targetLabel":"去总览查看健康状态"},{"title":"配置网络代理、GitHub 加速镜像或 Token","detail":"如果在线市场或 Git 仓库拉取失败，打开「设置 → 网络、代理与 GitHub」：填入本机代理地址（如 http://127.0.0.1:7890），或填入 GitHub 加速镜像前缀（如 https://gh-proxy.com/），拉取私有仓库还可填入 GitHub Personal Access Token，点「保存设置」立即生效。","uiPath":"左侧导航 → 设置 → 网络、代理与 GitHub","targetTab" :"条目筛选与搜索","desc":"支持按「全部条目 / 仅 Skills / 仅工作流」过滤，或按名称/slug 关键字即时检索。"},{"name":"左列「全局 / 项目」总开关","desc":"全局视图下点击即切换该 Skill/工作流是否全局启用；项目视图下点击即切换是否对整个项目启用。"},{"name":"Agent 交叉单元格","desc":"在全局视图点击可单独「屏蔽/取消屏蔽」该 Agent；在用户级或项目级点击未分配格子可直接设为「直配」，点击继承格子可设为「屏蔽」。"},{"name":"点击条目名称","desc":"若该行是 Skill，点击名称直接滑出右侧详情抽屉（预览 / 编辑 / 查看生效链路）。"}],"tips":["工作流排在矩阵最前面并带彩色标识点，Skill 排在下方，方便一眼区分套件与单个技能。"]},{"id":"mod-library","navTab":"library","badge":"3 · 中央仓库","title":"Skills 库与右侧详情抽屉","summary":"管理中央库中的所有 Skill 正本，支持在线创作、本地导入、旧技能收编、上游更新与链路追踪。","controls":[{"name":"扫描收编本机 Skills","desc":"自动扫描所有已配置 Agent 用户目录中未纳管且包含 SKILL.md 的目录（跳过以 . 开头的保护目录），勾选后自动复制到 store/ 并接管原 Agent 绑定。"},{"name":"导入文件夹 / 导入 ZIP","desc":"通过 Windows 原生选择器导入任意包含 SKILL.md 的本地目录或 .zip 压缩包（支持包内单层嵌套文件夹自动识别）。"},{"name":"新建 Skill","desc":"填写名称、标签、描述、作者和 Markdown 正文，自动生成安全 slug 与标准 YAML Frontmatter。"},{"name":"来源筛选（All / Local / Git / Market / Adopted）","desc":"快速筛选自建、Git 仓库安装、市场下载或本机收编的 Skill。"},{"name":"右侧详情抽屉（预览 / 编辑 / 生效链路）","desc":"点击任意卡片滑出：支持 Markdown 实时渲染、字段与正文在线编辑并「保存并同步」、有上游更新时显示「立即更新」、一键打开所在文件夹或外部编辑器（默认探测 VS Code）。"}],"tips":["删除 Skill 时会同步清理所有全局/用户/项目分配记录及磁盘上的托管联接与副本，不会误删非托管文件。"]},{"id":"mod-workflows","navTab":"workflows","badge":"4 · 阶段套件","title":"工作流套件 (Workflow Stacks)","summary":"将多个 Skills 按有序执行阶段打包成套件，支持导出编排指引文件与一键跨作用域绑定。","controls":[{"name":"新建 / 保存 / 删除工作流","desc":"创建新工作流（默认带 Plan / Build / Verify 三阶段）或修改内置工作流的名称、描述与标识颜色。"},{"name":"阶段编排（上下移动 / 增删阶段 / 添加 Skill）","desc":"按顺序组织多个阶段，每个阶段可自由挂载或移除任意库内 Skill。"},{"name":"导出工作流编排指引 SKILL.md","desc":"开启后，部署工作流时会在 guides/workflow-\u003cslug\u003e/ 自动生成阶段执行顺序说明文件并同步部署（需 Agent/项目也允许）。"},{"name":"快速绑定分配面板","desc":"在编辑器下方直接勾选绑定至「全局级生效」「单 Agent 用户级」或「项目级」，勾选即刻保存并同步。"}],"tips":["一个 Skill 可以同时属于多个阶段或多个工作流，部署器会自动去重，不会重复建多个目录。"]},{"id":"mod-projects","navTab":"projects","badge":"5 · 仓库隔离","title":"项目管理 (Projects)","summary":"为每个本地代码仓库独立配置启用的 Agents、工作流、直配 Skills、部署模式与 Git 忽略规则。","controls":[{"name":"添加项目 / 批量扫描工作区","desc":"支持添加单个项目目录，或扫描一个工作区父目录批量发现 Git / Go / Node / Rust / Python 项目（默认跳过 node_modules 等缓存目录，最多扫描 3 层）。"},{"name":"项目启用的 Agents","desc":"决定同步该项目时只往哪些 AI 工具的项目相对目录写入文件（如 .claude/skills、.cursor/skills）。"},{"name":"绑定工作流 \u0026 项目直配 Skills","desc":"只针对当前项目生效；右键直配 Skill 标签可快捷打开详情抽屉。"},{"name":"部署模式覆写（跟随 Agent / Junction / Copy）","desc":"在项目层面统一切换 Junction 零拷贝联接或真实文件复制模式。"},{"name":"自动维护 .gitignore 托管区块","desc":"原子更新项目 .gitignore 中 `# \u003e\u003e\u003e SkillsMan Managed \u003e\u003e\u003e` 区块，自动忽略 SkillsMan 托管路径；关闭后会自动清理该区块而不动其他内容。"},{"name":"单 Agent 例外覆写","desc":"在同一个项目内，为特定 Agent 单独覆写部署模式或追加 Extra Skills。"}],"tips":["点击「移除项目托管」时会先清理该项目内由 SkillsMan 管理的联接/副本和 .gitignore 托管块，保持项目干干净净。"]},{"id":"mod-repos","navTab":"repos","badge":"6 · 上游生态","title":"仓库与市场 (Repos \u0026 Market)","summary":"集成 Git 仓库源管理（单仓与 Monorepo 多技能自动发现）与在线 Registry 检索下载。","controls":[{"name":"添加并扫描 Git 仓库源","desc":"支持输入 GitHub 简写（如 owner/repo）或完整 Git HTTPS/SSH URL 及可选分支，自动克隆并递归扫描全部 SKILL.md 子目录。"},{"name":"拉取并扫描 / 检查全部更新 / 安装选中或全部","desc":"支持一键检测所有已缓存仓库的新提交，支持从 Monorepo 中勾选取需要的几个 Skill 入库，已入库项显示「已入库」徽章。"},{"name":"在线市场 (skills.sh) 检索","desc":"内置 skills.sh 搜索接口，输入关键词即可查看描述、作者、安装量与标签，点击「下载入库」自动拉取源仓对应子目录。"},{"name":"添加自定义 JSON 源","desc":"支持添加符合标准 JSON 数组的团队内部或第三方 Skill 市场 URL（支持 `{query}` 关键词占位符）。"}],"tips":["在设置中配置了 HTTP 代理或 GitHub 加速镜像前缀后，Git 克隆与在线市场检索都会自动走对应配置。"]},{"id":"mod-agents","navTab":"agents","badge":"7 · 工具适配","title":"Agent 配置 (Agents)","summary":"管理 11 个内置 AI Agent 与无限自定义 Agent 的路径、启用开关、默认部署模式与全局屏蔽项。","controls":[{"name":"重新扫描本机 Agent","desc":"重新探测电脑上新安装的 AI 工具配置目录，并自动启用新发现的 Agent。"},{"name":"新增自定义 Agent","desc":"为任何尚未内置的工具（如 Roo Code 或公司内部 CLI）自定义名称、用户级目录、项目级相对目录与默认部署模式。"},{"name":"展开卡片配置详情","desc":"支持修改 `~` 或 `%USERPROFILE%` / `%APPDATA%` 路径模板、默认部署模式（Junction / Copy）、「允许工作流指引文件」开关及查看/解除「已屏蔽的全局项」。"}],"tips":["内置 Agent 不可删除但可随时关闭右侧总开关；只有自定义 Agent 支持删除。"]},{"id":"mod-settings","navTab":"settings","badge":"8 · 偏好与驻留","title":"设置 (Settings)","summary":"控制应用外观、中央库位置、绿色便携模式、网络代理、外部编辑器及系统托盘自启行为。","controls":[{"name":"外观与语言","desc":"切换跟随系统 / 浅色 / 深色主题，跟随 Windows DWM 强调色，以及简体中文 / English 双语切换（系统托盘菜单同步切换）。"},{"name":"中央库与便携模式","desc":"查看当前激活的数据根目录并一键在资源管理器打开；标准模式下支持选择自定义中央库目录。"},{"name":"网络、代理与 GitHub","desc":"配置 HTTP/SOCKS5 代理、GitHub 镜像前缀与私有仓库 Personal Access Token。"},{"name":"系统托盘与后台行为","desc":"配置关闭窗口隐藏到托盘、Windows 开机静默自启（`--minimized` 写入当前用户 Run 注册表）、后台定时检查仓库更新间隔（最低 15 分钟）以及外部编辑器命令。"}],"tips":["除开关类项点击即保存外，输入框修改（如代理、镜像、Token、编辑器命令）请记得点击右上角「保存设置」。"]}],"agentsTitle":"内置 11 个 AI Agent 预设路径与探测规则","agentsSubtitle":"以下是 SkillsMan 内置支持的全部 Agent 及其默认用户级、项目级技能目录映射：","agentsHeaders":["Agent 名称","用户级 Skills 目录","项目级相对目录","默认模式","本机探测依据"],"mechanismsTitle":"核心机制、格式规范与快捷键速查","mechanismsSubtitle":"深入理解底层如何保障文件安全、无损同步与高效联动。","mechanisms":[{"id":"mech-scope","badge":"机制 1","title":"三层作用域解析与屏蔽（Mute）优先级规则","summary":"SkillsMan 在内存解析器（Resolver）中严格按层级合并最终生效列表：","paragraphs":["用户级与项目级彼此完全独立计算。全局配置只投递到每个已启用 Agent 的「用户级目录」，绝不会未经许可污染任何项目仓库目录。"],"bullets":["用户级生效公式：(全局 Skills/工作流 − Agent 全局屏蔽项) ∪ Agent 用户级直配 Skills/工作流。直配优先级高于全局屏蔽。","项目级生效公式：(项目直配 Skills ∪ 项目绑定工作流展开 − 项目排除 − 单 Agent 屏蔽) ∪ 单 Agent 例外追加。","多工作流或直配重复命中同一个 Skill 时，解析器自动合并来源标签（Sources）并只部署 1 份物理目标。"]},{"id":"mech-deploy","badge":"机制 2","title":"Junction 联接 vs Copy 复制 \u0026 三级覆写优先级","summary":"两种部署方式各自适用不同工作场景，并支持灵活的逐级覆写：","paragraphs":["部署模式按「单项目内单 Agent 例外覆写 \u003e 项目部署模式覆写 \u003e Agent 默认部署模式」的顺序生效；若均未指定，默认使用 Windows Junction。"],"table":{"headers":["对比维度","Junction（目录联接，默认）","Copy（真实文件复制）"],"rows":[{"cols":["磁盘占用","零额外复制，指向中央库同一份物理文件","在目标目录生成独立副本"]},{"cols":["编辑同步速度","中央库改完瞬间在所有 AI 工具生效","在抽屉保存或同步时按内容哈希对比更新"]},{"cols":["Windows 权限要求","无需管理员权限（通过原生 FSCTL 重解析点实现）","普通用户目录写入权限"]},{"cols":["是否适合提交 Git / Docker","不建议（链接指向本机绝对路径）","非常适合（真实文件可跨电脑与容器使用）"]},{"cols":["外部修改保护","直接读写同一份正本","若目标被外部改过，下次同步触发 drift 保护不覆盖"]}]}},{"id":"mech-skillmd","badge":"机制 3","title":"SKILL.md 标准格式与工作流指引生成格式","summary":"解析器识别文件夹内大小写不敏感的 SKILL.md（跳过 .git 和 node_modules），支持 YAML Frontmatter。","paragraphs":["如果 SKILL.md 省略了 `name` 或 `description`，SkillsMan 会自动回退读取一级 `# 标题`（或文件夹名）与正文首段作为简介；多行描述支持 YAML `|` 或 `\u003e` 语法，`tags`/`keywords` 支持行内数组与短横线列表。"],"codeBlock":{"label":"标准 SKILL.md 结构示例","code":"---\nname: Clean Go Reviewer\ndescription: Review Go edits for error handling and test coverage.\nauthor: Alice\nversion: 1.0.0\ntags: [go, review, testing]\n---\n\n## When to use\nApply before completing any Go package changes.\n\n## Instructions\n1. Check wrapped errors and context propagation.\n2. Run `go test ./...` after final edits."}},{"id":"mech-gitignore","badge":"机制 4","title":"项目 .gitignore 自动托管区块格式","summary":"开启「自动维护 .gitignore 托管区块」后，SkillsMan 仅在专用标记之间增删条目，绝不破坏你原有的忽略规则。","paragraphs":["当你在项目里关闭某个 Agent、取消某条 Skill 分配，或关闭托管开关时，下一次同步会自动精简或完整移除这段标记区块（不会创建空 .gitignore 文件）。"],"codeBlock":{"label":"项目根目录 .gitignore 中的托管片段","code":"# \u003e\u003e\u003e SkillsMan Managed \u003e\u003e\u003e\n.claude/skills/git-commit-helper/\n.cursor/skills/git-commit-helper/\n# \u003c\u003c\u003c SkillsMan Managed \u003c\u003c\u003c"}},{"id":"mech-health","badge":"机制 5","title":"健康检查 4 类异常与无损冲突保护机制","summary":"每次刷新和同步都会扫描状态文件中的部署记录与冲突清单，绝不静默删改未知文件。","paragraphs":["若目标位置已经存在非 SkillsMan 创建的目录、或目标目录下内容发生未知变动，同步器会记录 ConflictItem 并跳过写入，交由用户在「总览」面板抉择。"],"table":{"headers":["问题类型","常见触发原因","推荐处理动作"],"rows":[{"cols":["conflict","目标位置原本就有手动建的同名 Skill 目录，或切换 Copy→Junction 前副本有未同步修改","想保留就点「收编入库」；想用库内版本替换就点「备份后覆盖」（原目录存入 backups/）"]},{"cols":["drift","采用 Copy 模式部署后，你或同事直接在目标目录修改了文件导致哈希不一致","在「总览」点「强制覆盖同步」用正本覆写，或先手动合并修改回中央库"]},{"cols":["broken-junction","Junction 被外部软件删成了普通目录、指向了旧移动路径，或指向目标已丢失","点「强制覆盖同步」重建正确的目录联接"]},{"cols":["missing-target","状态显示应已部署，但磁盘上的目标文件夹被外部手动删除了","点「强制覆盖同步」或顶部「立即同步全部」重新创建"]}]}},{"id":"mech-storage","badge":"机制 6","title":"数据目录、便携模式、快捷键 (Ctrl+K) 与系统托盘","summary":"了解所有持久化文件的存储位置、便携模式触发条件以及全局快捷操作。","paragraphs":["标准模式下数据默认保存在 `~/.skillsman`（若修改了自定义目录，指向信息保存在 `%LOCALAPPDATA%\\SkillsMan\\bootstrap.json`）。如果在 `SkillsMan.exe` 同级目录存在名为 `portable` 的文件或 `data` 文件夹，应用会自动进入绿色便携模式，全部数据存入同级 `data/` 目录。"],"bullets":["数据根目录结构：`state.json`（全局配置与部署追踪表）、`store/`（Skill 正本）、`repos/`（Git 仓库缓存）、`guides/`（工作流编排指引）、`backups/`（冲突解决备份）、`docs/`（浏览器打开文档缓存）。","全局命令面板（`Ctrl+K`）：随时唤醒，支持模糊搜索页面导航、任意 Skill（回车直达详情抽屉）、工作流、项目以及「立即同步全部」「打开文档」等快捷动作。","Windows 系统托盘菜单：左键单击显示/隐藏主窗口；右键支持快速勾选开关全局工作流、立即同步全部、运行健康检查、检查仓库更新、一键打开使用指南以及开机静默自启（`--minimized`）。"]}]},"ui":{"noSearchMatches":"没有找到匹配的内容，换个关键词试试吧（比如：收编、Junction、Cursor、工作流）。","clearSearch":"清空搜索","themeSystem":"跟随系统","themeLight":"浅色","themeDark":"深色","langSwitchLabel":"语言","offlineBadge":"单文件离线文档"}},"en-US":{"locale":"en-US","hero":{"badge":"Zero-to-Hero Guide · Full Feature Reference","title":"SkillsMan Guide \u0026 Feature Documentation","subtitle":"Whether you are brand new to AI Skills or juggling Cursor, Claude Code, and Antigravity across multiple repositories, learn how to centralize, isolate, and sync everything in minutes.","tabGuide":"Beginner Tutorials","tabFeatures":"Feature Manual","openBrowserBtn":"Open in Browser","searchPlaceholder":"Search tutorial cases, UI buttons, agent paths, or troubleshooting...","progressLabel":"Learning Progress","resetProgressBtn":"Reset"},"sandbox":{"badge":"Practice Sandbox","title":"Want to try safely without touching real files? Use a demo Skill first","descReady":"Clicking below creates a sample Skill tagged \"skillsman-tutorial-demo\" in your central store. It will not deploy to any agent folder until you assign it, and never affects your real Skills.","descExists":"Your practice demo Skill is ready! Open its drawer to inspect SKILL.md, toggle it in the Assignment Matrix, or clean it up anytime with one click.","createBtn":"Create Practice Demo Skill","openDrawerBtn":"Preview / Edit Demo Skill","goMatrixBtn":"Try in Matrix","cleanupBtn":"Clean Up Demo Skill","createdToast":"Practice demo Skill created! Try following Case 2 or Case 5 with it.","cleanedToast":"Practice demo Skill safely removed (no real Skills were touched)."},"guide":{"conceptsTitle":"Lesson 0: 4 Core Concepts in Plain English","conceptsSubtitle":"Understand these 4 everyday analogies first and every screen in SkillsMan clicks immediately.","concepts":[{"id":"concept-skill","badge":"Concept 1","title":"What is a Skill?","analogy":"Like a standard operating handbook for a new teammate","summary":"A Skill is simply a folder with a SKILL.md instruction file inside. When an AI coding agent loads it, it follows your exact conventions for coding, code reviews, or commit messages.","details":["A Skill folder holds SKILL.md plus optional helper scripts or reference docs.","Instead of re-typing the same prompt instructions in every chat, save them once as a Skill."]},{"id":"concept-store","badge":"Concept 2","title":"What is the Central Store?","analogy":"Your master bookshelf holding the one canonical copy of every book","summary":"SkillsMan stores all downloaded, imported, created, or adopted Skills in one central directory (default ~/.skillsman/store), ending copy-paste chaos across separate tool folders.","details":["Edit SKILL.md once in the Skills Library and every linked agent picks up the change.","Supports default user home, a custom path, or USB-friendly Portable Mode."]},{"id":"concept-junction","badge":"Concept 3","title":"What is a Windows Junction?","analogy":"A zero-copy magic portal built into Windows—edit once, sync everywhere","summary":"The default deploy mode. Instead of duplicating files, SkillsMan places a native Windows directory Junction pointing back to the central store—zero admin privileges required.","details":["AI agents read a Junction just like a normal directory while using zero extra disk copies.","Saving SKILL.md in SkillsMan updates every Junction-linked agent instantaneously."]},{"id":"concept-copy","badge":"Concept 4","title":"When should I use Copy mode?","analogy":"Printing an independent physical copy you can commit or ship anywhere","summary":"When you want to commit `.claude/skills` into a team Git repository or run builds inside containers, Copy mode writes real standalone files instead of machine-local Junction links.","details":["If someone edits a deployed copy on disk, Health Check detects the drift instead of silently overwriting local edits."]}],"scopeDiagramTitle":"Interactive Diagram: How Skills Flow from Store to Agents","scopeDiagramSubtitle":"Click any tier below to inspect what it controls and when to choose it.","scopeLayers":[{"id":"store","badge":"0 · Canonical Source","title":"Central Store","pathHint":"~/.skillsman/store/\u003cskill-slug\u003e/","meaning":"The single source of truth for all Skills—whether downloaded from Git/Market, adopted locally, or authored from scratch.","whenToUse":"Use the Skills Library whenever you want to inspect, edit, or update a Skill’s master files.","ruleSummary":"Adding a Skill to the store does not deploy it automatically—you assign it through one of the 3 tiers below."},{"id":"global","badge":"1 · Global Scope","title":"Enable once, inherit across all enabled Agents","pathHint":"Deploys into every enabled agent’s user skills directory","meaning":"Best for universal habits you want everywhere: commit conventions, clean-code rules, or general debugging checklists.","whenToUse":"Choose Global when you want one click to equip Cursor, Claude Code, Antigravity, and others together.","ruleSummary":"Every enabled agent inherits Global items unless you explicitly Mute a specific item for one agent."},{"id":"user","badge":"2 · User Level","title":"Fine-tune a single Agent’s user directory","pathHint":"e.g. ~/.claude/skills/ or ~/.cursor/skills/","meaning":"Assign extra Skills or mute Global items for one specific AI tool without changing any other agent.","whenToUse":"Ideal when a Skill is tailored to a single tool (like Claude Code) or needs an exception.","ruleSummary":"Direct user-level assignment overrides a Global mute for that agent."},{"id":"project","badge":"3 · Project Level","title":"Isolate per repository without polluting other folders","pathHint":"e.g. \u003crepo\u003e/.claude/skills/ or .cursor/skills/","meaning":"Inject framework-specific or team-specific Skills only into one local codebase.","whenToUse":"Recommended when juggling separate frontend, backend, or client repositories.","ruleSummary":"Supports project-wide Junction/Copy override, automatic .gitignore management, and per-agent overrides."}],"matrixLegendTitle":"Reading the 5 Status Badges in Assignment Matrix","matrixLegendSubtitle":"Click cells or toggles in the Matrix to switch states. Here is what each badge means:","matrixLegend":[{"id":"global","label":"Global / Inherited","tone":"accent","meaning":"Inherited automatically from a Global binding or an active Workflow stack.","clickAction":"Click the cell in Global or User view to Mute it just for that agent."},{"id":"direct","label":"Direct","tone":"success","meaning":"Explicitly assigned at this specific level (User or Project) for that agent.","clickAction":"Click again to remove the direct assignment."},{"id":"muted","label":"Muted","tone":"warning","meaning":"Excluded on purpose for this agent even though Global or Project enables it.","clickAction":"Click again to Unmute and restore inheritance."},{"id":"conflict","label":"Conflict","tone":"danger","meaning":"An unmanaged folder or edited Copy exists at the target path, so SkillsMan paused to protect your files.","clickAction":"Open Overview → Health \u0026 Conflicts to Adopt to Store or Backup \u0026 Overwrite."},{"id":"inactive","label":"Off","tone":"neutral","meaning":"This Skill will not be deployed into the agent’s folder.","clickAction":"Click once in User Level or Project Level view to toggle Direct on."}],"routeSwitchLabelA":"Track A: 6-Step Guided Walkthrough","routeSwitchLabelB":"Track B: Quick Routes by Goal","routeADesc":"Complete the 6 progressive cases in order and check them off—your progress is saved automatically.","routeBDesc":"Short on time? Pick the scenario closest to your situation and jump straight to the matching cases.","cases":[{"id":"case-1","badge":"Case 1 · First Win","title":"Install your first Skill from Market or Git and deploy globally","duration":"2 min","scenario":"You just opened SkillsMan with an empty store and want a ready-made Skill working across your AI tools.","goal":"Fetch a Skill from skills.sh or a Git repository into the central store, bind it globally, and sync.","steps":[{"title":"Verify which AI agents are detected \u0026 enabled","detail":"Open the Agents page and check which tools show the green \"Detected\" badge (such as Claude Code, Cursor, or Antigravity). Make sure their toggle switch is on, or click \"Redetect Installed Agents\" if you installed a new tool.","uiPath":"Sidebar → Agents","targetTab":"agents","targetLabel":"Open Agents"},{"title":"Download a Skill from Market or Git Repos","detail":"Go to Repos \u0026 Market. Either search keywords (e.g. react, testing, commit) on the Online Market (skills.sh) tab and click \"Install\", or switch to Git Repositories, click \"Pull \u0026 Scan\" on Anthropic Official Skills, select skills, and click \"Install Selected\".","uiPath":"Sidebar → Repos \u0026 Market","targetTab":"repos","targetLabel":"Open Repos \u0026 Market","tip":"If GitHub access is slow in your network, set an HTTP proxy or GitHub Mirror Prefix in Settings first."},{"title":"Enable Global binding in Assignment Matrix","detail":"Open Matrix (defaults to Global scope), toggle the Global switch on your newly installed Skill row, and click \"Sync All\" in the top bar if needed.","uiPath":"Sidebar → Matrix → Global toggle","targetTab":"matrix","targetLabel":"Open Matrix"}],"verify":"Every enabled agent column turns Global / Inherited. Inspecting an agent user folder (e.g. ~/.claude/skills/) shows the new Skill directory synced cleanly.","advancedNote":{"title":"Under the hood: Why did downloading not immediately deploy the Skill?","bullets":["SkillsMan separates Storage (central store) from Assignment (Matrix / Projects) so installing never pollutes unrelated tools.","Once assigned, the Deployer creates native Windows Junctions or copies only into enabled target paths."]},"relatedRoles":["role-solo"]},{"id":"case-2","badge":"Case 2 · Adopt \u0026 Author","title":"Adopt scattered local Skills or create your own in 1 minute","duration":"3 min","scenario":"You already saved custom SKILL.md folders inside Cursor or Claude, or want to turn a prompt into a reusable Skill.","goal":"Sweep existing local Skills into the central store and learn the Skill Drawer editor.","steps":[{"title":"Scan \u0026 adopt unmanaged local Skills","detail":"Open Skills Library and click \"Adopt Local Skills\". SkillsMan scans all configured agent user directories for unmanaged SKILL.md folders. Check the ones you want and click \"Adopt Selected\".","uiPath":"Sidebar → Skills Library → Adopt Local Skills","targetTab":"library","targetLabel":"Open Skills Library","tip":"Safe by design: adopting copies files into store/, preserves the origin agent’s user-level binding, and replaces the folder with a managed link."},{"title":"Import a folder or ZIP package (optional)","detail":"Got a Skill folder or .zip archive from a teammate? Use \"Import Folder\" or \"Import ZIP\" at the top of Skills Library.","uiPath":"Skills Library → Import Folder / Import ZIP"},{"title":"Create and edit a Skill in the Drawer","detail":"Click \"New Skill\" (or click the Practice Sandbox button above), fill in Name, Tags, Description, and Markdown body. The right-side Skill Drawer opens automatically with Preview, Edit, and Effective Trace tabs plus \"Save \u0026 Sync\" or External Editor launch.","uiPath":"Skills Library → New Skill → Skill Drawer"}],"verify":"Your adopted or newly created Skill appears as a card in Skills Library. Any edits saved in the drawer reflect immediately across Junction links and auto-sync Copy targets.","advancedNote":{"title":"Under the hood: How are slug collisions handled during adoption?","bullets":["If a central store Skill already uses that slug, the modal flags it with \"Slug exists\" and generates a unique suffix (e.g. my-skill-2) without overwriting your existing Skill.","Saving edits recalculates the SHA-256 content hash so Copy deployments automatically refresh."]},"relatedRoles":["role-solo","role-migrate"]},{"id":"case-3","badge":"Case 3 · Project Isolation","title":"Configure per-project Skills without cluttering Git history","duration":"3 min","scenario":"You work across separate frontend and backend repositories and want project-specific Skills kept clean in Git.","goal":"Register local projects, bind project Skills/Workflows, and configure .gitignore automation or Copy mode.","steps":[{"title":"Add a project or batch scan your workspace","detail":"Go to Projects and click \"Add Project\" to pick a repo folder, or click \"Scan Workspace\" to discover multiple Git/Node/Go/Python/Rust repos under one parent directory.","uiPath":"Sidebar → Projects → Add Project / Scan Workspace","targetTab":"projects","targetLabel":"Open Projects"},{"title":"Choose project Agents, Workflows, and Direct Skills","detail":"In the right inspector, select which Agents apply to this project, then toggle \"Bound Workflows\" and \"Direct Project Skills\". Right-click any skill pill to open its drawer directly.","uiPath":"Projects → Right Inspector Panel"},{"title":"Pick Junction + .gitignore vs Copy mode for team sharing","detail":"For personal isolation, keep Junction mode and toggle \"Auto-manage .gitignore block\" on so SkillsMan keeps managed folders out of git status. For team-shared repos or CI containers, set \"Deploy Mode Override\" to \"Real File Copy\" and disable .gitignore management. Click \"Sync Project\".","uiPath":"Projects → Deploy Mode Override / .gitignore → Sync Project"}],"verify":"Target folders like .claude/skills/ appear inside the repository. When .gitignore management is enabled, a dedicated `# \u003e\u003e\u003e SkillsMan Managed \u003e\u003e\u003e` block keeps them untracked.","advancedNote":{"title":"Under the hood: Do Global Skills leak into project folders?","bullets":["Never. Global assignments only deploy into agent user-level folders; project folders are strictly governed by that project’s own Workflows, Direct Skills, and Per-Agent Overrides.","Deploy mode precedence: Per-Agent Project Override \u003e Project Override \u003e Agent Default."]},"relatedRoles":["role-team"]},{"id":"case-4","badge":"Case 4 · Workflows \u0026 Tray","title":"Combine Skills into staged Workflows and toggle from the Tray","duration":"3 min","scenario":"Real tasks follow stages like Plan → Build → Test → Review, and toggling individual Skills every time gets repetitive.","goal":"Build multi-stage Workflows, optionally emit orchestration guides, and switch stacks in one click from the system tray.","steps":[{"title":"Organize stages inside Workflows","detail":"Open Workflows to customize the built-in \"fullstack-standard\" workflow or click \"New Workflow\". Add Skills into ordered stages and adjust stage order with the up/down arrows.","uiPath":"Sidebar → Workflows","targetTab":"workflows","targetLabel":"Open Workflows"},{"title":"Optionally emit a workflow orchestration SKILL.md","detail":"Enable \"Generate workflow guide SKILL.md\" and click \"Save Workflow\". When deployed, SkillsMan generates a `workflow-\u003cslug\u003e/SKILL.md` guide explaining the ordered stages and Skills.","uiPath":"Workflows → Generate workflow guide SKILL.md → Save Workflow"},{"title":"Bind across scopes and toggle from Windows System Tray","detail":"Use \"Quick Bindings\" at the bottom to attach the stack to Global Scope, User Agents, or Projects. Any Global workflow can also be toggled from Overview or right-clicking the SkillsMan tray icon → \"Quick Global Workflows\".","uiPath":"Workflows Quick Bindings / Overview / Windows System Tray"}],"verify":"Overview and the Windows tray submenu stay in sync immediately, and all stage Skills deploy together cleanly without duplicates.","advancedNote":{"title":"Under the hood: Controlling where workflow guides appear","bullets":["A workflow guide deploys only when BOTH the Workflow’s \"Generate guide\" toggle AND the target Agent/Project’s \"workflowGuideEnabled\" toggle are on.","If a Skill appears in multiple stages or active workflows, SkillsMan deduplicates it automatically."]},"relatedRoles":["role-solo","role-team"]},{"id":"case-5","badge":"Case 5 · Precision Control","title":"Mute individual Agents in Matrix \u0026 inspect Effective Trace","duration":"2 min","scenario":"You enabled a Global Skill everywhere, except one Agent should skip it—or you want to audit every path where a Skill lives.","goal":"Mute or directly assign individual cells across Matrix scopes and audit deployments with Effective Trace.","steps":[{"title":"Mute an inherited Skill for a single Agent","detail":"Open Matrix and click a blue \"Global\" cell under any Agent column. It flips to an orange \"Muted\" badge—removing the Skill only from that Agent while leaving all others active.","uiPath":"Sidebar → Matrix → Click inherited cell","targetTab":"matrix","targetLabel":"Open Matrix"},{"title":"Switch to User Level or Project Level for direct overrides","detail":"Switch the top SegmentedControl to \"User Level\" or \"Project Level\" and click any \"Off\" cell to toggle \"Direct\" on for just that Agent. Click any Skill row title to open its drawer.","uiPath":"Matrix → User Level / Project Level → Click cell"},{"title":"Inspect Effective Trace inside Skill Drawer","detail":"Inside any Skill’s drawer, open the \"Effective Trace\" tab to see every active or muted User and Project path, its exact sources (global, workflow, direct, agent-override), deploy mode, and sync health.","uiPath":"Click any Skill → Drawer → Effective Trace","tip":"Press Ctrl+K anywhere to jump straight to any Skill drawer, Workflow, Project, or Sync All."}],"verify":"Expanding that Agent on the Agents page lists the item under \"Muted Global Items\" (with a quick X to unmute), and Effective Trace reflects the updated state.","advancedNote":{"title":"Under the hood: How do Direct and Muted interact?","bullets":["At User Level, explicit Direct assignment (`UserSkillIDs`) takes precedence over Global Mute.","At Project Level, Per-Agent `ExtraSkillIDs` override both project exclusions and per-agent mutes."]},"relatedRoles":["role-team","role-migrate"]},{"id":"case-6","badge":"Case 6 · Operations \u0026 Portable","title":"Resolve conflicts safely, configure proxies, and use Portable Mode","duration":"3 min","scenario":"Sync warns about an existing unmanaged directory, GitHub clones time out, or you want a self-contained USB setup.","goal":"Use Health Check safely, set HTTP proxy / GitHub mirror, and activate zero-install Portable Mode.","steps":[{"title":"Resolve conflicts \u0026 copy drift without data loss","detail":"When Overview shows a red badge on the sidebar, SkillsMan protected an existing folder rather than overwriting it. Under \"Health \u0026 Conflicts\", pick \"Adopt to Store\" to keep it as a Skill, \"Backup \u0026 Overwrite\" to archive it into `backups/` first, or \"Force Sync Copy\" to refresh drifted Copy targets.","uiPath":"Sidebar → Overview → Health \u0026 Conflicts","targetTab":"dashboard","targetLabel":"Open Overview"},{"title":"Configure HTTP/SOCKS5 proxy, GitHub mirror, or Token","detail":"Open Settings → Network, Proxy \u0026 GitHub. Fill in HTTP Proxy (e.g. `http://127.0.0.1:7890`), an optional GitHub Mirror Prefix (e.g. `https://gh-proxy.com/`), or a GitHub PAT for private repos and click \"Save Settings\".","uiPath":"Sidebar → Settings → Network, Proxy \u0026 GitHub","targetTab":"settings","targetLabel":"Open Settings"},{"title":"Enable Portable Mode \u0026 background tray persistence","detail":"Place an empty file named `portable` (or a `data/` folder) next to `SkillsMan.exe` and restart. The title bar displays a \"Portable\" badge and keeps all state and skills inside `./data`. You can also enable \"Minimize to tray on close\" and \"Start minimized at Windows logon\" in Settings.","uiPath":"Next to SkillsMan.exe / Settings → System Tray \u0026 Background"}],"verify":"Overview displays green \"All junctions, copies, and workflow guides are healthy with zero conflicts.\" Portable Mode shows the \"Portable\" pill in the top title bar.","advancedNote":{"title":"Under the hood: Inside your SkillsMan data root","bullets":["store/: Canonical Skill folders indexed by slug.","repos/: Cached Git clones used for fast upstream SHA update checks.","guides/: Auto-generated `workflow-\u003cslug\u003e/SKILL.md` orchestration packages.","backups/: Timestamped archives created whenever you choose \"Backup \u0026 Overwrite\"."]},"relatedRoles":["role-migrate"]}],"roles":[{"id":"role-solo","badge":"Track 1 · Most Popular","title":"Solo Daily Development","subtitle":"I use 1–2 AI coding tools and want immediate productivity gains","persona":"Best for individual developers and AI coding beginners.","outcome":"Install market skills, author a custom Skill in 1 minute, and switch workflows from the tray.","recommendedCaseIds":["case-1","case-2","case-4"],"checklist":[{"label":"1. Confirm your installed AI tools are enabled on Agents","caseId":"case-1","targetTab":"agents"},{"label":"2. Install 1–2 Skills from Repos \u0026 Market and toggle Global on","caseId":"case-1","targetTab":"repos"},{"label":"3. Author one personal habit Skill in Skills Library","caseId":"case-2","targetTab":"library"},{"label":"4. Group favorite Skills into a Workflow and toggle via Tray","caseId":"case-4","targetTab":"workflows"}]},{"id":"role-team","badge":"Track 2 · Multi-Repo","title":"Multi-Project \u0026 Team Collaboration","subtitle":"I juggle multiple codebases and need clean isolation or Git sharing","persona":"Best for engineers managing several repos or sharing conventions across a team.","outcome":"Keep project rules isolated with managed .gitignore blocks or team-friendly Copy mode.","recommendedCaseIds":["case-3","case-4","case-5"],"checklist":[{"label":"1. Batch scan or a name":"Row Title Click","desc":"Clicking a Skill row title opens its Skill Drawer immediately."}],"tips":["Workflow rows are listed above Skill rows with their accent color dots for fast visual scanning."]},{"id":"mod-library","navTab":"library","badge":"3 · Canonical Store","title":"Skills Library \u0026 Skill Drawer","summary":"Central repository for creating, importing, adopting, editing, updating, and tracing Skills.","controls":[{"name":"Adopt Local Skills","desc":"Scans configured agent user folders for unmanaged SKILL.md directories (ignoring hidden dot-folders), imports them, and preserves origin bindings."},{"name":"Import Folder / Import ZIP","desc":"Native Windows picker for local Skill folders or ZIP archives (supports nested single-root folders)."},{"name":"New Skill","desc":"Creates a new Skill directory in store/ with serialized YAML frontmatter and Markdown body."},{"name":"Source Filter (All / Local / Git / Market / Adopted)","desc":"Filters cards by origin type alongside live tag/title search."},{"name":"Skill Drawer (Preview / Edit / Effective Trace)","desc":"Shows rendered Markdown, attached files list, inline metadata \u0026 body editing with Save \u0026 Sync, upstream Update action, and Folder/External Editor launch."}],"tips":["Deleting a Skill safely removes its store directory, clears all scope references, and cleans up tracked deployments."]},{"id":"mod-workflows","navTab":"workflows","badge":"4 · Stage Stacks","title":"Workflow Stacks","summary":"Bundle Skills into ordered stages, optionally generate guide Skills, and bind across scopes.","controls":[{"name":"New / Save / Delete Workflow","desc":"Create or edit workflow name, description, accent color, and stage definitions."},{"name":"Stage Builder","desc":"Add, rename, reorder (up/down), or remove stages and attach Skills to each stage."},{"name":"Generate workflow guide SKILL.md","desc":"When enabled alongside Agent/Project workflowGuideEnabled, generates `workflow-\u003cslug\u003e/SKILL.md` listing the ordered stages."},{"name":"Quick Bindings Panel","desc":"Attach the selected workflow directly to Global Scope, User Agents, or Projects with immediate sync."}],"tips":["Duplicate Skills across stages or active workflows are deduplicated automatically during deployment."]},{"id":"mod-projects","navTab":"projects","badge":"5 · Repo Isolation","title":"Projects","summary":"Independent per-repository configuration for agents, workflows, direct skills, deploy mode, and .gitignore.","controls":[{"name":"Add Project / Scan Workspace","desc":"Register a single directory or scan up to 3 levels under a workspace root for Git/Go/Node/Python/Rust projects."},{"name":"Enabled Agents","desc":"Controls which agents receive project-relative deployments inside this repository."},{"name":"Bound Workflows \u0026 Direct Project Skills","desc":"Assigns project-scoped stacks or individual Skills; right-click any skill pill to open its drawer."},{"name":"Deploy Mode Override","desc":"Override to Follow Agent Default, Windows Junction, or Real File Copy."},{"name":"Auto-manage .gitignore block","desc":"Atomically maintains `# \u003e\u003e\u003e SkillsMan Managed \u003e\u003e\u003e` entries inside `.gitignore`."},{"name":"Per-Agent Overrides","desc":"Customize deploy mode or add Extra Skills for one specific agent inside the project."}],"tips":["Removing a project cleans up its SkillsMan-managed links/copies and removes the managed .gitignore block."]},{"id":"mod-repos","navTab":"repos","badge":"6 · Upstream Sources","title":"Repos \u0026 Market","summary":"Manage Git/GitHub repositories (single or monorepo) and browse skills.sh or custom JSON registries.","controls":[{"name":"Add \u0026 Scan Git Repository","desc":"Accepts `owner/repo` shorthand or full Git URL with optional branch; clones and discovers every SKILL.md subpath."},{"name":"Pull \u0026 Scan / Check All Updates / Install Selected or All","desc":"Checks upstream HEAD commits, installs individual skills from monorepos, and marks installed entries."},{"name":"Online Market (skills.sh)","desc":"Search skills by keyword, inspect installs/tags/author, and install directly into the central store."},{"name":"Add Custom JSON Registry","desc":"Connect team or third-party JSON feeds (supports `{query}` placeholder)."}],"tips":["Both Git operations and HTTP registry queries honor your configured HTTP Proxy, GitHub Mirror, and PAT."]},{"id":"mod-agents","navTab":"agents","badge":"7 · Tool Profiles","title":"Agents","summary":"Manage 11 built-in AI coding agents and custom agent profiles, paths, defaults, and mutes.","controls":[{"name":"Redetect Installed Agents","desc":"Rescans local config markers and enables newly detected agents."},{"name":"Add Custom Agent","desc":"Define any custom tool with user directory, project relative directory, and default deploy mode."},{"name":"Agent Expander Settings","desc":"Edit `~` / `%USERPROFILE%` / `%APPDATA%` paths, default Junction/Copy mode, Emit Workflow Guide toggle, and manage Muted Global Items."}],"tips":["Built-in agents cannot be deleted (just toggle them off); custom agents can be removed anytime."]},{"id":"mod-settings","navTab":"settings","badge":"8 · Preferences","title":"Settings","summary":"Configure Windows theme \u0026 accent sync, bilingual UI, central store root, proxy, autostart, and tray behavior.","controls":[{"name":"Appearance \u0026 Language","desc":"System/Light/Dark theme, Windows DWM accent sync, and Simplified Chinese / English UI + Tray localization."},{"name":"Central Store \u0026 Portable Mode","desc":"Inspect active data root, open it in Explorer, or pick a custom store root in Standard Mode."},{"name":"Network, Proxy \u0026 GitHub","desc":"Configure HTTP/SOCKS5 proxy, GitHub mirror URL prefix, and GitHub Personal Access Token."},{"name":"System Tray \u0026 Background","desc":"Minimize to tray on close, HKCU Run logon autostart (`--minimized`), background repo update interval (\u003e= 15 min), and External Editor command."}],"tips":["Remember to click \"Save Settings\" after editing text inputs such as Proxy, Mirror, Token, or Custom Editor."]}],"agentsTitle":"11 Built-in Agent Presets \u0026 Path Mapping","agentsSubtitle":"Exact user-level and project-relative directories used by SkillsMan out of the box:","agentsHeaders":["Agent Name","User Skills Directory","Project Relative Directory","Default Mode","Detection Markers"],"mechanismsTitle":"Core Mechanisms, File Specs \u0026 Shortcuts","mechanismsSubtitle":"Technical details on resolution rules, deployment safety, file schemas, and shortcuts.","mechanisms":[{"id":"mech-scope","badge":"Mechanism 1","title":"3-Tier Resolution \u0026 Mute Precedence","summary":"The resolver computes User-level and Project-level effective entries independently:","paragraphs":["Global assignments deploy exclusively to enabled agents’ user-level folders and never automatically touch project directories."],"bullets":["User Level: `(Global Items − Agent Global Mutes) ∪ Agent Direct User Items`. Direct User assignment overrides a Global mute.","Project Level: `(Project Direct Skills ∪ Project Workflows − Project Exclusions − Agent Mutes) ∪ Per-Agent Extra Items`.","Duplicate hits across multiple workflows or direct bindings are merged into one target deployment with combined source tags."]},{"id":"mech-deploy","badge":"Mechanism 2","title":"Junction vs Copy \u0026 3-Level Mode Override","summary":"Deploy mode is resolved by: Per-Agent Project Override \u003e Project Override \u003e Agent Default (defaults to Junction).","paragraphs":["Choose Junction for instant zero-copy sync on your machine, or Copy when files must be committed to Git or shared outside Windows."],"table":{"headers":["Dimension","Junction (Default)","Copy (Real File Copy)"],"rows":[{"cols":["Disk Footprint","Zero duplicate files; points to central store/","Independent file copy at target path"]},{"cols":["Edit Propagation","Instant across all linked agents","Updated on Save \u0026 Sync / Sync All via SHA-256 comparison"]},{"cols":["Privileges","Standard Windows user (native FSCTL reparse point)","Standard folder write permission"]},{"cols":["Git / Container Friendly","No (machine-local link)","Yes (real files portable across machines)"]},{"cols":["Local Edit Protection","Edits canonical copy directly","Modified target triggers drift conflict instead of overwriting"]}]}},{"id":"mech-skillmd","badge":"Mechanism 3","title":"SKILL.md Frontmatter Schema","summary":"SkillsMan scans case-insensitive SKILL.md inside each Skill directory (skipping .git and node_modules).","paragraphs":["If `name` or `description` is omitted in YAML frontmatter, SkillsMan falls back to the first `# Heading` (or folder name) and the first paragraph of the Markdown body."],"codeBlock":{"label":"Canonical SKILL.md Example","code":"---\nname: Clean Go Reviewer\ndescription: Review Go edits for error handling and test coverage.\nauthor: Alice\nversion: 1.0.0\ntags: [go, review, testing]\n---\n\n## When to use\nApply before completing any Go package changes.\n\n## Instructions\n1. Check wrapped errors and context propagation.\n2. Run `go test ./...` after final edits."}},{"id":"mech-gitignore","badge":"Mechanism 4","title":"Managed .gitignore Section Format","summary":"When enabled on a project, SkillsMan atomically writes only between its dedicated markers.","paragraphs":["Disabling agents, removing skills, or turning off .gitignore management cleans up the managed block automatically on the next sync without altering your custom rules."],"codeBlock":{"label":"Managed Block in Project .gitignore","code":"# \u003e\u003e\u003e SkillsMan Managed \u003e\u003e\u003e\n.claude/skills/git-commit-helper/\n.cursor/skills/git-commit-helper/\n# \u003c\u003c\u003c SkillsMan Managed \u003c\u003c\u003c"}},{"id":"mech-health","badge":"Mechanism 5","title":"Health Check Issue Types \u0026 Conflict Protection","summary":"SkillsMan never silently deletes or overwrites unmanaged directories or modified Copy targets.","paragraphs":["Any anomalous deployment surfaces in Overview → Health \u0026 Conflicts with non-destructive remediation buttons."],"table":{"headers":["Kind","Cause","Recommended Action"],"rows":[{"cols":["conflict","An unmanaged folder already exists at targetPath, or a Copy target has unsynced edits before switching to Junction","Click \"Adopt to Store\" to keep it as a Skill, or \"Backup \u0026 Overwrite\" to archive into backups/ first"]},{"cols":["drift","A Copy-mode folder was edited on disk so its SHA-256 differs from DeployedHash","Click \"Force Sync Copy\" to restore from store/, or copy your changes back to store/ first"]},{"cols":["broken-junction","Junction became a regular folder, points to a stale location, or its store target is missing","Click \"Force Sync Copy\" (recreates clean target link)"]},{"cols":["missing-target","Tracked deployment folder was removed externally from disk","Click \"Force Sync Copy\" or \"Sync All\" to restore"]}]}},{"id":"mech-storage","badge":"Mechanism 6","title":"Data Root, Portable Mode, Ctrl+K \u0026 System Tray","summary":"Where SkillsMan stores state, how Portable Mode activates, and global keyboard/tray shortcuts.","paragraphs":["Standard mode defaults to `~/.skillsman` (custom store paths are remembered in `%LOCALAPPDATA%\\SkillsMan\\bootstrap.json`). Placing an empty `portable` file or a `data/` directory beside `SkillsMan.exe` activates Portable Mode using `./data`."],"bullets":["Data Root Layout: `state.json` (state \u0026 deployment map), `store/` (canonical Skills), `repos/` (Git caches), `guides/` (workflow guides), `backups/` (conflict backups), `docs/` (browser launch cache).","Command Palette (`Ctrl+K`): Fuzzy search navigation tabs, Skills (opens Drawer), Workflows, Projects, Sync All, and Open Docs in Browser.","Windows System Tray: Left-click toggles the window; right-click offers Quick Global Workflows checkboxes, Sync All Now, Run Health Check, Check Repo Updates, Guide \u0026 Docs, and Start Minimized on Boot (`--minimized`)."]}]},"ui":{"noSearchMatches":"No matching sections found. Try another keyword like \"adopt\", \"Junction\", \"Cursor\", or \"workflow\".","clearSearch":"Clear Search","themeSystem":"System","themeLight":"Light","themeDark":"Dark","langSwitchLabel":"Language","offlineBadge":"Single-File Offline Docs"}}},"agents":[{"id":"agents-universal","name":"Universal (.agents)","userSkillsDir":"~/.agents/skills","projectSkillsRelDir":".agents/skills","defaultMode":"junction","detectNotesZh":"检测到 ~/.agents 目录存在时自动启用","detectNotesEn":"Auto-detected when ~/.agents exists"},{"id":"claude","name":"Claude Code","userSkillsDir":"~/.claude/skills","projectSkillsRelDir":".claude/skills","defaultMode":"junction","detectNotesZh":"检测到 ~/.claude 目录时自动启用","detectNotesEn":"Auto-detected when ~/.claude exists"},{"id":"codex","name":"OpenAI Codex","userSkillsDir":"~/.codex/skills","projectSkillsRelDir":".codex/skills","defaultMode":"junction","detectNotesZh":"检测到 ~/.codex 目录时自动启用","detectNotesEn":"Auto-detected when ~/.codex exists"},{"id":"antigravity","name":"Antigravity / Gemini","userSkillsDir":"~/.gemini/antigravity/skills","projectSkillsRelDir":".agent/skills","defaultMode":"junction","detectNotesZh":"检测 ~/.gemini/antigravity 或 %APPDATA%/Antigravity","detectNotesEn":"Detects ~/.gemini/antigravity or %APPDATA%/Antigravity"},{"id":"cursor","name":"Cursor","userSkillsDir":"~/.cursor/skills","projectSkillsRelDir":".cursor/skills","defaultMode":"junction","detectNotesZh":"检测 ~/.cursor 或 %APPDATA%/Cursor","detectNotesEn":"Detects ~/.cursor or %APPDATA%/Cursor"},{"id":"windsurf","name":"Windsurf","userSkillsDir":"~/.codeium/windsurf/skills","projectSkillsRelDir":".windsurf/skills","defaultMode":"junction","detectNotesZh":"检测 ~/.codeium/windsurf 或 %APPDATA%/Windsurf","detectNotesEn":"Detects ~/.codeium/windsurf or %APPDATA%/Windsurf"},{"id":"copilot","name":"VS Code Copilot","userSkillsDir":"~/.copilot/skills","projectSkillsRelDir":".github/sk id":"tpl-review","badge":"Review","titleZh":"代码审查与安全自检模板","titleEn":"Code Review \u0026 Guardrails Template","descZh":"让 AI 在提交或重构前自动按清单排查空指针、边界错误与重复代码。","descEn":"Instructs AI agents to run a structured checklist for edge cases, security, and duplication before finishing edits.","code":"---\nname: Clean Code Reviewer\ndescription: Review modified files for correctness, edge cases, duplication, and clear error handling.\nauthor: Team Lead\nversion: 1.0.0\ntags: [review, quality, safety]\n---\n\n## When to use\n\nRun before concluding any non-trivial code change or when the user asks for a review.\n\n## Checklist\n\n1. **Correctness \u0026 Edge Cases**: Verify nil/empty inputs, error returns, and boundary conditions.\n2. **No Duplicate Logic**: Extract shared helpers instead of copy-pasting blocks.\n3. **Security Hygiene**: Never hardcode secrets, tokens, or unescaped shell/SQL inputs.\n4. **Verification**: Run the project's unit tests or typecheck after final edits.\n"},{"id":"tpl-project","badge":"Project","titleZh":"项目技术栈约束模板（配合项目级分配）","titleEn":"Project Stack Convention Template","descZh":"绑定到特定代码仓库，统一告诉所有协作 Agent 本项目使用的框架、包管理器和目录规范。","descEn":"Bind to a specific project so every enabled agent follows the same stack, package manager, and folder conventions.","code":"---\nname: Project Stack Conventions\ndescription: Enforce project-specific tech stack, package manager, and coding conventions.\nauthor: Maintainer\nversion: 1.0.0\ntags: [project, conventions, typescript]\n---\n\n## Stack Rules\n\n- **Package Manager**: Use `pnpm` (never `npm install` or `yarn`).\n- **Styling**: Follow existing CSS variables and theme tokens; avoid hardcoded hex colors.\n- **Validation**: Always run `pnpm run build` before reporting completion.\n"}]};
    const PROGRESS_KEY = 'skillsman.docs.progress.v1';

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function parseHashParams() {
      const h = (window.location.hash || '').replace(/^#/, '');
      if (!h || !h.includes('=')) return {};
      const out = {};
      for (const pair of h.split('&')) {
        const [k, v] = pair.split('=');
        if (k && v) out[decodeURIComponent(k)] = decodeURIComponent(v);
      }
      return out;
    }

    function loadProgress() {
      try {
        const raw = localStorage.getItem(PROGRESS_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        return new Set(Array.isArray(arr) ? arr : []);
      } catch {
        return new Set();
      }
    }

    function saveProgress(set) {
      try {
        localStorage.setItem(PROGRESS_KEY, JSON.stringify(Array.from(set)));
      } catch {}
    }

    const hashPref = parseHashParams();
    let initialPref = {
      tab: localStorage.getItem('skillsman.docs.tab') || 'guide',
      lang: localStorage.getItem('skillsman.docs.lang') || 'zh-CN',
      theme: localStorage.getItem('skillsman.docs.theme') || 'system',
    };

    if (LAUNCH_PREF && typeof LAUNCH_PREF === 'object') {
      const lastTs = localStorage.getItem('skillsman.docs.lastLaunchTs');
      if (String(LAUNCH_PREF.ts || '') !== String(lastTs || '')) {
        if (LAUNCH_PREF.tab === 'guide' || LAUNCH_PREF.tab === 'features') initialPref.tab = LAUNCH_PREF.tab;
        if (LAUNCH_PREF.lang === 'zh-CN' || LAUNCH_PREF.lang === 'en-US') initialPref.lang = LAUNCH_PREF.lang;
        if (LAUNCH_PREF.theme === 'system' || LAUNCH_PREF.theme === 'light' || LAUNCH_PREF.theme === 'dark') {
          initialPref.theme = LAUNCH_PREF.theme;
        }
        try {
          localStorage.setItem('skillsman.docs.lastLaunchTs', String(LAUNCH_PREF.ts || ''));
        } catch {}
      }
    }

    if (hashPref.tab === 'guide' || hashPref.tab === 'features') initialPref.tab = hashPref.tab;
    if (hashPref.lang === 'zh-CN' || hashPref.lang === 'en-US') initialPref.lang = hashPref.lang;
    if (hashPref.theme === 'system' || hashPref.theme === 'light' || hashPref.theme === 'dark') {
      initialPref.theme = hashPref.theme;
    }

    const state = {
      tab: initialPref.tab === 'features' ? 'features' : 'guide',
      lang: initialPref.lang === 'en-US' ? 'en-US' : 'zh-CN',
      theme: ['system', 'light', 'dark'].includes(initialPref.theme) ? initialPref.theme : 'system',
      route: 'trackA',
      activeScope: 'store',
      activeToc: '',
      search: '',
      doneCases: loadProgress(),
    };

    function applyTheme() {
      const sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = state.theme === 'dark' || (state.theme === 'system' && sysDark);
      document.documentElement.classList.toggle('dark', isDark);
      document.documentElement.lang = state.lang;
      try {
        localStorage.setItem('skillsman.docs.tab', state.tab);
        localStorage.setItem('skillsman.docs.lang', state.lang);
        localStorage.setItem('skillsman.docs.theme', state.theme);
      } catch {}
    }

    function showToast(msg) {
      const el = document.getElementById('toastBox');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
    }

    async function copyText(text, okMsg) {
      try {
        await navigator.clipboard.writeText(text);
        showToast(okMsg);
      } catch {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(okMsg);
      }
    }

    function matchesQuery(text, q) {
      if (!q) return true;
      return String(text || '').toLowerCase().includes(q);
    }

    function scrollToSection(id) {
      state.activeToc = id;
      const target = document.getElementById(id);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        target.classList.add('flash-highlight');
        setTimeout(() => target.classList.remove('flash-highlight'), 1400);
      }
      renderToc();
    }

    function renderTopbar() {
      const doc = DATA.docs[state.lang];
      document.title = doc.hero.title;
      document.getElementById('offlineBadge').textContent = doc.ui.offlineBadge;
      const searchInput = document.getElementById('searchInput');
      searchInput.placeholder = doc.hero.searchPlaceholder;
      if (searchInput.value !== state.search) searchInput.value = state.search;

      document.getElementById('mainTabSwitch').innerHTML = [
        { id: 'guide', label: doc.hero.tabGuide },
        { id: 'features', label: doc.hero.tabFeatures },

        .map(
          (item) =>
            `<button type="button" class="${state.tab === item.id ? 'active' : ''}" data-tab="${item.id}">${escapeHtml(item.label)}</button>`
        )
        .join('');

      document.getElementById('langSwitch').innerHTML = [
        { id: 'zh-CN', label: '中文' },
        { id: 'en-US', label: 'EN' },
      ]
        .map(
          (item) =>
            `<button type="button" class="${state.lang === item.id ? 'active' : ''}" data-lang="${item.id}">${item.label}</button>`
        )
        .join('');

      document.getElementById('themeSwitch').innerHTML = [
        { id: 'system', label: doc.ui.themeSystem },
        { id: 'light', label: doc.ui.themeLight },
        { id: 'dark', label: doc.ui.themeDark },
      ]
        .map(
          (item) =>
            `<button type="button" class="${state.theme === item.id ? 'active' : ''}" data-theme="${item.id}">${escapeHtml(item.label)}</button>`
        )
        .join('');
    }

    function renderToc() {
      const doc = DATA.docs[state.lang];
      const rail = document.getElementById('tocRail');
      const items =
        state.tab === 'guide'
          ? [
              { group: doc.hero.tabGuide, links: [
                { id: 'sec-concepts', label: doc.guide.conceptsTitle },
                { id: 'sec-scope', label: doc.guide.scopeDiagramTitle },
                { id: 'sec-legend', label: doc.guide.matrixLegendTitle },
                { id: 'sec-routes', label: state.route === 'trackA' ? doc.guide.routeSwitchLabelA : doc.guide.routeSwitchLabelB },
                ...doc.guide.cases.map((c) => ({ id: c.id, label: c.badge + ' · ' + c.title })),
                { id: 'sec-templates', label: doc.guide.templatesTitle },
              ]},
            ]
          : [
              { group: doc.features.tocModulesTitle, links: doc.features.modules.map((m) => ({ id: m.id, label: m.title })) },
              { group: doc.features.tocAgentsTitle, links: [{ id: 'sec-agents-table', label: doc.features.agentsTitle }] },
              { group: doc.features.tocMechanismsTitle, links: doc.features.mechanisms.map((m) => ({ id: m.id, label: m.title })) },
            ];

      rail.innerHTML = items
        .map(
          (g) => `
          <div class="toc-group-label">${escapeHtml(g.group)}</div>
          ${g.links
            .map(
              (l) =>
                `<button type="button" class="toc-link ${state.activeToc === l.id ? 'active' : ''}" data-scroll="${escapeHtml(l.id)}"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(l.label)}</span></button>`
            )
            .join('')}
        `
        )
        .join('');
    }

    function renderGuide() {
      const doc = DATA.docs[state.lang];

      const concepts = doc.guide.concepts.filter((c) =>
        matchesQuery(c.title + ' ' + c.analogy + ' ' + c.summary + ' ' + c.details.join(' '), q)

        matchesQuery(

      );
      const templates = DATA.templates.filter((t) => {

        ${!q ? `
